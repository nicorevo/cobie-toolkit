    expected_columns: [Name, CreatedBy, CreatedOn, Category, Status, TypeName, Description, Duration, DurationUnit, Start, TaskStartUnit, Frequency, FrequencyUnit, ExternalSystem, ExternalObject, ExternalIdentifier, TaskNumber, Priors, ResourceNames]
  Impact:
