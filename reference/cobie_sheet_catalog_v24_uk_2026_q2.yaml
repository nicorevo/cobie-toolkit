    expected_columns: [Name, CreatedBy, CreatedOn, ConnectionType, SheetName, RowName1, RowName2, RealizingElement, PortName1, PortName2, ExternalSystem, ExternalObject, ExternalIdentifier, Description]
  Spare:
    table: "cobie.spare"
    primary_display: "name"
    expected_columns: [Name, CreatedBy, CreatedOn, Category, TypeName, Suppliers, ExternalSystem, ExternalObject, ExternalIdentifier, SetNumber, PartNumber, Description]
  Resource:
    table: "cobie.resource"
    primary_display: "name"
    expected_columns: [Name, CreatedBy, CreatedOn, Category, ExternalSystem, ExternalObject, ExternalIdentifier, Description]
  Job:
    table: "cobie.job"
