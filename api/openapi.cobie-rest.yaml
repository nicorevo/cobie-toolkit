  /rpc/create_workbook:
    post:
      tags:
        - RPC
      summary: Create workbook through checked RPC
      description: Creates a workbook only when `auth.uid()` is a member of `p_organization_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkbookArgs'
            example:
              p_organization_id: 11111111-1111-1111-1111-111111111111
              p_name: New COBie Workbook
              p_template_name: COBie Template Q2 April 2026
      responses:
        '200':
          description: Created workbook row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workbook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /rpc/validate_workbook:
    post:
      tags:
        - RPC
      summary: Validate a workbook
      description: Returns validation rows only when the authenticated user is a member of the workbook organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateWorkbookArgs'
            example:
              p_workbook_id: 22222222-2222-2222-2222-222222222222
      responses:
        '200':
          description: Validation issues visible to the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationIssue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
