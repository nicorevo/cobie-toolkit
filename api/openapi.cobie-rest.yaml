openapi: 3.0.3
info:
  title: COBie Supabase REST API
  version: 0.1.0
  description: >
    MVP REST contract for COBie data exposed through Supabase/PostgREST.
    The `api` schema is the default profile. COBie tables require the
    `cobie` profile and application membership tables require the `app`
    profile. PostgreSQL RLS remains the authorization boundary.
servers:
  - url: http://127.0.0.1:54321/rest/v1
    description: Local Supabase stack
  - url: https://{projectRef}.supabase.co/rest/v1
    description: Hosted Supabase project
    variables:
      projectRef:
        default: example
security:
  - SupabaseAuth: []
    SupabaseApiKey: []
tags:
  - name: API read models
    description: Read-only views in the default `api` schema.
  - name: COBie tables
    description: Sheet-compatible tables in the `cobie` schema.
  - name: App tables
    description: Application tenant membership tables in the `app` schema.
  - name: RPC
    description: Transactional operations exposed as PostgREST RPC endpoints.
components:
  securitySchemes:
    SupabaseAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
      description: Supabase user access token.
    SupabaseApiKey:
      type: apiKey
      in: header
      name: apikey
      description: Supabase publishable key. It is not an authorization boundary.
  parameters:
    Range:
      name: Range
      in: header
      required: false
      schema:
        type: string
      example: "0-49"
      description: PostgREST range pagination.
    PreferCount:
      name: Prefer
      in: header
      required: false
      schema:
        type: string
      example: count=exact
      description: Request count metadata for paginated lists.
    PreferRepresentation:
      name: Prefer
      in: header
      required: false
      schema:
        type: string
      example: return=representation
      description: Return inserted or updated rows.
    AcceptProfileCobie:
      name: Accept-Profile
      in: header
      required: true
      schema:
        type: string
        enum:
          - cobie
      description: Selects the `cobie` PostgREST schema profile.
    ContentProfileCobie:
      name: Content-Profile
      in: header
      required: true
      schema:
        type: string
        enum:
          - cobie
      description: Writes to the `cobie` PostgREST schema profile.
    AcceptProfileApp:
      name: Accept-Profile
      in: header
      required: true
      schema:
        type: string
        enum:
          - app
      description: Selects the `app` PostgREST schema profile.
    Select:
      name: select
      in: query
      required: false
      schema:
        type: string
      example: "*"
      description: PostgREST projection expression.
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
      example: name.asc
      description: PostgREST sort expression.
    IdFilter:
      name: id
      in: query
      required: false
      schema:
        type: string
      example: eq.11111111-1111-1111-1111-111111111111
      description: PostgREST filter, commonly required for PATCH.
    OrganizationFilter:
      name: organization_id
      in: query
      required: false
      schema:
        type: string
      example: eq.11111111-1111-1111-1111-111111111111
      description: Tenant organization filter.
    WorkbookFilter:
      name: workbook_id
      in: query
      required: false
      schema:
        type: string
      example: eq.22222222-2222-2222-2222-222222222222
      description: COBie workbook filter.
    NameFilter:
      name: name
      in: query
      required: false
      schema:
        type: string
      example: ilike.*pump*
      description: Common textual name filter.
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    PostgrestError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          nullable: true
        hint:
          type: string
          nullable: true
      required:
        - code
        - message
    Workbook:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        standard_version:
          type: string
          nullable: true
        template_name:
          type: string
          nullable: true
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ValidationIssue:
      type: object
      properties:
        severity:
          type: string
        rule_id:
          type: string
        sheet_name:
          type: string
          nullable: true
        row_name:
          type: string
          nullable: true
        field_name:
          type: string
          nullable: true
        message:
          type: string
      required:
        - severity
        - rule_id
        - message
    CreateWorkbookArgs:
      type: object
      properties:
        p_organization_id:
          type: string
          format: uuid
        p_name:
          type: string
        p_template_name:
          type: string
          nullable: true
      required:
        - p_organization_id
        - p_name
    ValidateWorkbookArgs:
      type: object
      properties:
        p_workbook_id:
          type: string
          format: uuid
      required:
        - p_workbook_id
  requestBodies:
    WorkbookInsert:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/JsonObject'
              - type: object
                properties:
                  organization_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                required:
                  - organization_id
                  - name
          example:
            organization_id: 11111111-1111-1111-1111-111111111111
            name: New COBie Workbook
            template_name: COBie Template Q2 April 2026
    GenericCobieInsert:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/JsonObject'
              - type: object
                properties:
                  organization_id:
                    type: string
                    format: uuid
                  workbook_id:
                    type: string
                    format: uuid
                required:
                  - organization_id
                  - workbook_id
          examples:
            component:
              value:
                organization_id: 11111111-1111-1111-1111-111111111111
                workbook_id: 22222222-2222-2222-2222-222222222222
                name: AHU-01
                type_id: 33333333-3333-3333-3333-333333333333
    GenericPatch:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonObject'
          example:
            description: Updated description
  responses:
    RowList:
      description: Rows visible to the authenticated user after RLS.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/JsonObject'
    MutationRows:
      description: "Rows inserted or updated when `Prefer: return=representation` is used."
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/JsonObject'
    Unauthorized:
      description: Missing or invalid Supabase user session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PostgrestError'
    Forbidden:
      description: Authenticated user is not authorized by grants or RLS.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PostgrestError'

paths:
  /cobie_assets:
    get:
      tags:
        - API read models
      summary: List COBie asset read model rows
      description: Read-only view joining components, types and spaces. RLS is enforced through `security_invoker`.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/WorkbookFilter'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/PreferCount'
      responses:
        '200':
          $ref: '#/components/responses/RowList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cobie_space_index:
    get:
      tags:
        - API read models
      summary: List COBie space index rows
      description: Read-only view for spaces with floor category context.
      parameters:
        - $ref: '#/components/parameters/Select'
        - $ref: '#/components/parameters/WorkbookFilter'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/PreferCount'
      responses:
